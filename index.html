<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMOAKO BUILDING MANAGER</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f3;
  color:#26352d;
}
header{
  background:#174b3a;
  color:white;
  padding:25px 18px;
}
header h1{margin:0;font-size:23px}
header p{margin:8px 0 0;color:#d7e8df}
main{max-width:1100px;margin:auto;padding:18px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
button{
  border:0;
  padding:11px 15px;
  border-radius:6px;
  background:#174b3a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.88}
.secondary{background:#e2ece6;color:#174b3a}
.danger{background:#a52c2c}
nav button.active{background:#092f22}
.panel{
  display:none;
  background:white;
  border-radius:10px;
  padding:18px;
  border:1px solid #dce5df;
  margin-bottom:18px;
}
.panel.active{display:block}
h2{color:#174b3a;font-size:20px;margin-top:0}
h3{color:#174b3a}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
}
.card{
  background:white;
  border:1px solid #dce5df;
  padding:17px;
  border-radius:9px;
}
.card span{display:block;color:#68766e;font-size:13px}
.card strong{
  display:block;
  color:#174b3a;
  font-size:22px;
  margin-top:9px;
}
form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin:15px 0 22px;
}
label{font-size:13px;color:#43534a}
input,select,textarea{
  width:100%;
  padding:11px;
  margin-top:6px;
  border:1px solid #cbd8d0;
  border-radius:6px;
  font-size:14px;
}
.form-buttons{display:flex;gap:8px;align-items:end}
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  font-size:13px;
}
th,td{
  border:1px solid #dce5df;
  padding:10px;
  text-align:left;
}
th{background:#174b3a;color:white}
.num{text-align:right;white-space:nowrap}
.actions{white-space:nowrap}
.actions button{padding:6px;font-size:11px}
.notice{
  background:#edf5f0;
  padding:13px;
  border-radius:7px;
  margin:15px 0;
}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}
footer{
  text-align:center;
  color:#718078;
  padding:25px;
  font-size:12px;
}
@media print{
  nav,.no-print,footer,header{display:none!important}
  body{background:white}
  main{padding:0;max-width:none}
  .panel{display:block!important;border:0}
  .panel:not(#dashboard){page-break-before:always}
}
</style>
</head>

<body>

<header>
<h1>AMOAKO BUILDING MANAGER</h1>
<p>Building Project Financial Management System</p>
</header>

<main>

<nav>
<button class="active" onclick="showTab('dashboard',this)">Dashboard</button>
<button onclick="showTab('funds',this)">Sources of Funds</button>
<button onclick="showTab('materials',this)">Materials</button>
<button onclick="showTab('labour',this)">Labour</button>
<button onclick="showTab('records',this)">All Records</button>
<button onclick="showTab('reports',this)">Reports & Backup</button>
</nav>

<!-- DASHBOARD -->

<section id="dashboard" class="panel active">

<h2>Financial Overview</h2>

<div class="cards">

<div class="card">
<span>Total Money Invested</span>
<strong id="totalFunds">GH₵ 0.00</strong>
</div>

<div class="card">
<span>Total Material Cost</span>
<strong id="materialTotal">GH₵ 0.00</strong>
</div>

<div class="card">
<span>Total Labour Cost</span>
<strong id="labourTotal">GH₵ 0.00</strong>
</div>

<div class="card">
<span>Total Expenditure</span>
<strong id="totalSpent">GH₵ 0.00</strong>
</div>

<div class="card">
<span>Available Funds</span>
<strong id="balance">GH₵ 0.00</strong>
</
