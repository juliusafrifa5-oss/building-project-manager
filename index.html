<script>
/* =========================================
   AMOAKO BUILDING MANAGER
   PROFESSIONAL PDF REPORT GENERATOR
========================================= */

document.getElementById('print').onclick = function () {

    try {

        // Check data availability
        if (typeof data === 'undefined') {
            alert('Project data could not be loaded.');
            return;
        }

        const investments = data.investments || [];
        const entries = data.entries || [];
        const stages = data.stages || [];
        const workers = data.workers || [];

        // Open report window
        const reportWindow = window.open('', '_blank');

        if (!reportWindow) {
            alert('Please allow pop-ups for this website and try again.');
            return;
        }

        // Formatting functions
        const escapeHTML = value =>
            String(value ?? '-').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);

        const formatMoney = value =>
            'GH₵ ' + Number(value || 0).toLocaleString('en-GH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        // Financial calculations
        const invested = investments.reduce(
            (sum, item) => sum + Number(item.amount || 0), 0
        );

        const spent = entries.reduce(
            (sum, item) => sum + Number(item.amount || 0), 0
        );

        const available = invested - spent;

        // Investment sources
        const sources = ['Susu', 'Remittance', 'Motor sales'];

        const sourceTotals = sources.map(source => ({
            name: source,
            amount: investments
                .filter(item => item.source === source)
                .reduce((sum, item) => sum + Number(item.amount || 0), 0)
        }));

        // Expense categories
        const categories = ['Materials', 'Labour', 'Other'];

        const expenseTotals = categories.map(category => ({
            name: category,
            amount: entries
                .filter(item => item.kind === category)
                .reduce((sum, item) => sum + Number(item.amount || 0), 0)
        }));

        // Construction progress
        const overall = stages.length
            ? Math.round(
                stages.reduce(
                    (sum, stage) => sum + Number(stage[1] || 0), 0
                ) / stages.length
            )
            : 0;

        const generated = new Date().toLocaleDateString('en-GH', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });

        // Table generator
        const tableRows = (headers, rows) => `
            <table>
                <thead>
                    <tr>
                        ${headers.map(header =>
                            `<th>${escapeHTML(header)}</th>`
                        ).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${rows || ''}
                </tbody>
            </table>
        `;

        // Investment records
        const investmentRows = investments.length
            ? investments.map(item => `
                <tr>
                    <td>${escapeHTML(item.date)}</td>
                    <td>${escapeHTML(item.source)}</td>
                    <td>${escapeHTML(item.contributor)}</td>
                    <td>${escapeHTML(item.description)}</td>
                    <td class="money">${formatMoney(item.amount)}</td>
                    <td>${escapeHTML(item.notes)}</td>
                </tr>
            `).join('')
            : '<tr><td colspan="6">No investment records.</td></tr>';

        // Expenditure records
        const expenseRows = entries.length
            ? entries.map(item => `
                <tr>
                    <td>${escapeHTML(item.date)}</td>
                    <td>${escapeHTML(item.kind)}</td>
                    <td>${escapeHTML(item.item)}</td>
                    <td>${escapeHTML(item.qty)} ${escapeHTML(item.unit || '')}</td>
                    <td>${escapeHTML(item.payee)}</td>
                    <td class="money">${formatMoney(item.amount)}</td>
                    <td>${escapeHTML(item.notes)}</td>
                </tr>
            `).join('')
            : '<tr><td colspan="7">No expense records.</td></tr>';

        // Investment breakdown
        const sourceRows = sourceTotals.map(item => `
            <tr>
                <td>${escapeHTML(item.name)}</td>
                <td class="money">${formatMoney(item.amount)}</td>
            </tr>
        `).join('');

        // Expense breakdown
        const categoryRows = expenseTotals.map(item => `
            <tr>
                <td>${escapeHTML(item.name)}</td>
                <td class="money">${formatMoney(item.amount)}</td>
            </tr>
        `).join('');

        // Labour records
        const workerRows = workers.length
            ? workers.map(worker => `
                <tr>
                    <td>${escapeHTML(worker.name)}</td>
                    <td>${escapeHTML(worker.trade)}</td>
                    <td>${escapeHTML(worker.basis)}</td>
                    <td class="money">${formatMoney(worker.rate)}</td>
                </tr>
            `).join('')
            : '<tr><td colspan="4">No registered labourers.</td></tr>';

        // Construction stages
        const progressRows = stages.length
            ? stages.map(stage => `
                <tr>
                    <td>${escapeHTML(stage[0])}</td>
                    <td>${Number(stage[1] || 0)}%</td>
                </tr>
            `).join('')
            : '<tr><td colspan="2">No construction progress recorded.</td></tr>';

        // Generate report
        reportWindow.document.open();

        reportWindow.document.write(`

        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>Amoako Building Manager Report</title>

            <style>

                * {
                    box-sizing: border-box;
                }

                body {
                    font-family: Arial, sans-serif;
                    color: #202820;
                    margin: 25px;
                    font-size: 11px;
                    line-height: 1.5;
                }

                h1 {
                    font-size: 24px;
                    margin: 0;
                    color: #174b3a;
                }

                h2 {
                    font-size: 15px;
                    color: #174b3a;
                    border-bottom: 2px solid #174b3a;
                    padding-bottom: 6px;
                    margin-top: 25px;
                }

                .header {
                    text-align: center;
                    border-bottom: 3px solid #174b3a;
                    padding-bottom: 15px;
                }

                .subtitle {
                    color: #64736b;
                    font-size: 12px;
                }

                .summary {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 10px;
                    margin-top: 18px;
                }

                .box {
                    border: 1px solid #cbd7d0;
                    padding: 12px;
                    border-radius: 5px;
                }

                .box span {
                    display: block;
                    color: #64736b;
                    font-size: 10px;
                }

                .box strong {
                    font-size: 17px;
                    color: #174b3a;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 9px;
                }

                th {
                    background: #174b3a;
                    color: white;
                    text-align: left;
                }

                th, td {
                    border: 1px solid #d8e1dc;
                    padding: 7px;
                    vertical-align: top;
                }

                .money {
                    text-align: right;
                    white-space: nowrap;
                }

                .total {
                    font-weight: bold;
                    background: #eef4f0;
                    padding: 9px;
                }

                .note {
                    background: #f1f6f3;
                    padding: 12px;
                    margin-top: 15px;
                }

                .signatures {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 50px;
                    margin-top: 55px;
                }

                .sign {
                    border-top: 1px solid #333;
                    padding-top: 7px;
                    text-align: center;
                }

                .footer {
                    margin-top: 30px;
                    text-align: center;
                    color: #64736b;
                    border-top: 1px solid #ccc;
                    padding-top: 10px;
                }

                @page {
                    size: A4;
                    margin: 15mm;
                }

                @media print {
                    body {
                        margin: 0;
                    }

                    h2 {
                        break-after: avoid;
                    }

                    table {
                        break-inside: auto;
                    }

                    tr {
                        break-inside: avoid;
                    }

                    .box, .note {
                        break-inside: avoid;
                    }
                }

            </style>
        </head>

        <body>

            <div class="header">

                <h1>AMOAKO BUILDING MANAGER</h1>

                <p class="subtitle">
                    BUILDING PROJECT FINANCIAL AND PROGRESS REPORT
                </p>

                <p>
                    Investment · Expenditure · Labour · Materials · Construction Progress
                </p>

                <p>
                    <b>Report generated:</b> ${generated}
                </p>

            </div>

            <h2>1. FINANCIAL SUMMARY</h2>

            <div class="summary">

                <div class="box">
                    <span>Total Investment</span>
                    <strong>${formatMoney(invested)}</strong>
                </div>

                <div class="box">
                    <span>Total Expenditure</span>
                    <strong>${formatMoney(spent)}</strong>
                </div>

                <div class="box">
                    <span>Available Funds</span>
                    <strong>${formatMoney(available)}</strong>
                </div>

                <div class="box">
                    <span>Overall Construction Progress</span>
                    <strong>${overall}%</strong>
                </div>

            </div>

            <h2>2. INVESTMENT BREAKDOWN</h2>

            ${tableRows(
                ['Investment Source', 'Total Amount'],
                sourceRows
            )}

            <p class="total">
                Total Investment: ${formatMoney(invested)}
            </p>

            <h2>3. EXPENDITURE BREAKDOWN</h2>

            ${tableRows(
                ['Expense Category', 'Total Amount'],
                categoryRows
            )}

            <p class="total">
                Total Expenditure: ${formatMoney(spent)}
            </p>

            <h2>4. DETAILED INVESTMENT RECORDS</h2>

            ${tableRows(
                ['Date', 'Source', 'Contributor', 'Description', 'Amount', 'Notes'],
                investmentRows
            )}

            <h2>5. DETAILED EXPENSE RECORDS</h2>

            ${tableRows(
                ['Date', 'Category', 'Description', 'Quantity', 'Recipient', 'Amount', 'Notes'],
                expenseRows
            )}

            <h2>6. REGISTERED LABOURERS</h2>

            ${tableRows(
                ['Name', 'Trade / Role', 'Payment Basis', 'Agreed Rate'],
                workerRows
            )}

            <h2>7. CONSTRUCTION PROGRESS</h2>

            ${tableRows(
                ['Construction Stage', 'Completion'],
                progressRows
            )}

            <div class="note">

                <b>FINANCIAL POSITION</b><br><br>

                Total funds invested: ${formatMoney(invested)}<br>

                Total project expenditure: ${formatMoney(spent)}<br>

                Available funds: ${formatMoney(available)}<br><br>

                This report is generated from the records entered into
                Amoako Building Manager.

            </div>

            <div class="signatures">

                <div class="sign">
                    Project Owner's Signature
                </div>

                <div class="sign">
                    Date
                </div>

            </div>

            <div class="footer">

                Amoako Building Manager · Building Project Records · GH₵

            </div>

        </body>
        </html>

        `);

        reportWindow.document.close();

        // Wait for report rendering before printing
        setTimeout(() => {

            if (!reportWindow.closed) {
                reportWindow.focus();
                reportWindow.print();
            }

        }, 1000);

    } catch (error) {

        console.error('PDF Report Error:', error);

        alert('Unable to generate report. Please check the application data and try again.');

    }

};

</script>
